<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lời Chúc 20/11</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=639304470361110811">

  <link rel="stylesheet" href="css/chalk-letter.css">

<body>

  <div class="board-frame">
    <div class="board-inner">

      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <div id="letter-screen">
        <!-- Tiêu đề -->
        <div class="letter-to chalk-flicker" id="letterTo"></div>
        <div class="chalk-line"></div>

        <!-- Nội dung lời chúc -->
        <div class="letter-box">
          <div id="message"></div>
        </div>

        <div class="chalk-line"></div>

        <!-- Nút hành động -->
        <div id="action-buttons">
          <button class="action-btn flower" onclick="go('flowers.html')">🌺 Nhận Hoa</button>
          <button class="action-btn gift"   onclick="go('gift.html')">🎁 Nhận Quà</button>
          <button class="action-btn memory" onclick="go('memory.html')">📖 Sổ Ký Ức</button>
        </div>
      </div>

    </div>
  </div>

  <div id="dust-container"></div>

  <script src="js/chalk-letter.js"></script>
  <script src="js/music.js"></script>
