<head>

  <link rel="stylesheet" href="css/style.css">

  <title>Hoa Tặng Thầy Cô 20/11</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=639304470361110811">
  <link rel="shortcut icon" href="favicon.ico?v=639304470361110811">
  <style>
    /* Override màu cho 20/11 — hoa hồng đỏ */
    :root {
      --flower-color-1: #dc2626;
      --flower-color-2: #991b1b;
      --flower-color-3: #b91c1c;
      --light-color: #fde68a;
      --bg-top: #0f172a;
      --bg-bottom: #1e293b;
    }

    .happy-woman-day {
      font-family: 'Baloo 2', sans-serif;
      font-size: clamp(1.3rem, 4vw, 2.2rem);
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(220,38,38,0.4), 0 0 40px rgba(220,38,38,0.2);
      color: #fca5a5;
    }

    /* Hoa đỏ */
    .flower__leaf--1, .flower__leaf--2,
    .flower__leaf--3, .flower__leaf--4 {
      background: linear-gradient(to bottom, #dc2626, #991b1b) !important;
    }
    .flower__leafs--1 .flower__leaf--1,
    .flower__leafs--1 .flower__leaf--2,
    .flower__leafs--1 .flower__leaf--3,
    .flower__leafs--1 .flower__leaf--4 {
      background: linear-gradient(to bottom, #ef4444, #b91c1c) !important;
    }
    .flower__leafs--2 .flower__leaf--1,
    .flower__leafs--2 .flower__leaf--2,
    .flower__leafs--2 .flower__leaf--3,
    .flower__leafs--2 .flower__leaf--4 {
      background: linear-gradient(to bottom, #dc2626, #7f1d1d) !important;
    }
    .flower__leafs--3 .flower__leaf--1,
    .flower__leafs--3 .flower__leaf--2,
    .flower__leafs--3 .flower__leaf--3,
    .flower__leafs--3 .flower__leaf--4 {
      background: linear-gradient(to bottom, #f87171, #dc2626) !important;
    }

    /* Nhụy vàng */
    .flower__white-circle {
      background: radial-gradient(circle, #fef9c3, #fde68a) !important;
      box-shadow: 0 0 8px rgba(253,230,138,0.6) !important;
    }

    /* Ánh sáng vàng */
    .flower__light { background: #fde68a !important; }

    /* Nền đêm sâu hơn */
    .night {
      background: radial-gradient(ellipse at bottom, #1e293b 0%, #0f172a 100%) !important;
    }

    /* Nút quay về */
    .back-btn {
      position: fixed;
      bottom: 28px; left: 50%; transform: translateX(-50%);
      font-family: 'Baloo 2', sans-serif;
      font-size: 1.1rem;
      padding: 8px 24px;
      background: transparent;
      border: 2px solid rgba(248,250,252,0.35);
      color: rgba(248,250,252,0.7);
      border-radius: 4px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.25s;
      text-decoration: none; display: inline-block;
    }
    .back-btn:hover { border-color: #fca5a5; color: #fca5a5; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
